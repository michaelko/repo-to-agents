name: Generated instruction drift

on:
  pull_request:
  push:
    branches: [main]

jobs:
  repo-to-agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx repo-to-agents --check --targets agents,copilot,cursor,claude
